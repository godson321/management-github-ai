[package]
name = "github-batch-manager"
version = "0.2.0"
description = "A Tauri desktop app for managing multiple local GitHub repositories."
authors = ["github-batch-manager"]
license = ""
repository = ""
default-run = "github-batch-manager"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "github_batch_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
